<body class="ws-standalone">
  <!-- Standalone home for the wholesale form, for when the Spline object
       (or any link) opens in a NEW TAB rather than on the homepage. The
       popup itself is built by js/wholesale.js, so there's one copy of the
       form, not two. -->
  <a href="index.html" class="ws-standalone-logo" aria-label="Ember home">
    <img src="images/Artboard-12_1.svg" alt="" width="46">
  </a>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="js/wholesale.js"></script>
  <script>
    // Open on load and keep it open — closing returns to the homepage
    // rather than leaving an empty page behind.
    window.EmberWholesale.open();
    document.addEventListener("ember:wholesale-closed", function () {
      window.location.href = "index.html";
    });
  </script>
